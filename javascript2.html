<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Java Script</title>
</head>
<body>
    <h2>Daftar Pengunjung</h2>
    <!--output Javascript ditampilkan di tag paragraf dengan id="pengunjung"-->
    <p id="pengunjung"></p>
    <script>
        let nama = prompt("Nama Anda Siapa?");
        document.getElementById("pengunjung").innerHTML=
        "SEMANGAATTT LAPRAKKKNYA " +nama+ ", JANGAN MARAH MARAH MULU";

    </script>
</body>
</html>
