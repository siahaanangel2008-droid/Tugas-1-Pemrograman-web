<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar CSS</title>
    <link rel="stylesheet" href="format.css" />
    <style>
        h1{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            color: blue;
            text-align: center;
        }
        .sorot{
            color: #ff0000;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bolder;
        }
        .tengah{
            text-align: center;
        }
        .kanan{
            text-align: right;
        }
        #artikel{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 20px;
            color:green;
        }
    </style>
</head>
<body>
    <!--RGB = Red Green Blue. Warna merah : #FF0000, Biru =#0000F, Hijau = 00FF00-->
    <h1>Materi Kuliah Pertemuan Ke-4</h1>
    <h3 class="sorot tengah"> CSS - Cascading style Sheets</h3><br />
    <h1>Materi Kuliah Pertemuan Ke-5</h1>
    <b>JavaScript</b>
    <p class="kanan sorot"> JavaScript</p>
    <p id="artikel"> Besok tanggal 18 September 2026 pukul 08.00 akan dipelajari bahasa pemrograman JavaScript
    </p>
    <p style="color:brown; text-align: justify; background-color: black">
        Ini adalah kalimat dengan CSS Inline Style.
    </p>
</body>
</html>
